[global]
# Python Package Index Configuration

# Default index
index-url = https://pypi.org/simple/

# GitLab Package Registry (uncomment to use)
# extra-index-url = ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/simple/

# Cache settings
cache-dir = ${CI_PROJECT_DIR}/.pip-cache

# Security settings
trusted-host = pypi.org
               pypi.python.org
               files.pythonhosted.org

# Install settings
timeout = 60
retries = 3

[install]
# Upgrade strategy
upgrade-strategy = only-if-needed

# Compile options
compile = true
no-deps = false