# GitLab CI/CD Pipeline for {{ repo_name }} React Library
# Generated by GitLab Repository Sculptor

stages:
  - test
  - build
  - publish

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  paths:
    - node_modules/
    - .npm/

# Test stage
test:
  stage: test
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running React component tests..."
    - npm run lint
    - npm run type-check || true
    - npm run test -- --coverage --watchAll=false
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/

# Visual regression tests (Storybook)
visual_tests:
  stage: test
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build-storybook || echo "Storybook not configured"
    - npm run test:visual || echo "Visual tests not configured"
  allow_failure: true

# Build library
build:
  stage: build
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Building React library..."
    - npm run build
    - npm run build:storybook || echo "Storybook build skipped"
    - npm pack
  artifacts:
    paths:
      - "*.tgz"
      - dist/
      - lib/
      - storybook-static/
    expire_in: 1 week
  only:
    - main
    - tags

# Bundle analysis
bundle_analysis:
  stage: build
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run analyze || echo "Bundle analyzer not configured"
  artifacts:
    paths:
      - bundle-analyzer-report.html
  allow_failure: true
  only:
    - main

# Security audit
security:
  stage: test
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm audit --audit-level moderate
  allow_failure: true

# Publish to npm registry (manual action)
publish:npm:
  stage: publish
  image: node:$NODE_VERSION
  before_script:
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
  script:
    - npm publish
  dependencies:
    - build
  when: manual
  only:
    - tags

# Publish to GitLab Package Registry
publish:gitlab:
  stage: publish
  image: node:$NODE_VERSION
  before_script:
    - echo "@$CI_PROJECT_ROOT_NAMESPACE:registry=$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/" > .npmrc
    - echo "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/:_authToken=$CI_JOB_TOKEN" >> .npmrc
  script:
    - npm publish
  dependencies:
    - build
  only:
    - tags

# Deploy Storybook to GitLab Pages
pages:
  stage: publish
  image: alpine:latest
  script:
    - mkdir public
    - cp -r storybook-static/* public/ || echo "No Storybook build found"
    - echo "Storybook deployed to GitLab Pages"
  artifacts:
    paths:
      - public
  dependencies:
    - build
  only:
    - main