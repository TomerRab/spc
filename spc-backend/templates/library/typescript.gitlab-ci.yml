# GitLab CI/CD Pipeline for {{ repo_name }} TypeScript Library
# Generated by GitLab Repository Sculptor

stages:
  - test
  - build
  - publish

variables:
  NODE_VERSION: "18"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  paths:
    - node_modules/
    - .npm/

# Test stage
test:
  stage: test
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Running TypeScript library tests..."
    - npm run lint
    - npm run type-check
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/

# Build package
build:
  stage: build
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Building TypeScript library..."
    - npm run build
    - npm run build:types
    - npm pack
  artifacts:
    paths:
      - "*.tgz"
      - dist/
      - lib/
      - types/
    expire_in: 1 week
  only:
    - main
    - tags

# Security audit
security:
  stage: test
  image: node:$NODE_VERSION
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm audit --audit-level moderate
  allow_failure: true

# Publish to npm registry (manual action)
publish:npm:
  stage: publish
  image: node:$NODE_VERSION
  before_script:
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > .npmrc
  script:
    - npm publish
  dependencies:
    - build
  when: manual
  only:
    - tags

# Publish to GitLab Package Registry
publish:gitlab:
  stage: publish
  image: node:$NODE_VERSION
  before_script:
    - echo "@$CI_PROJECT_ROOT_NAMESPACE:registry=$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/" > .npmrc
    - echo "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/npm/:_authToken=$CI_JOB_TOKEN" >> .npmrc
  script:
    - npm publish
  dependencies:
    - build
  only:
    - tags