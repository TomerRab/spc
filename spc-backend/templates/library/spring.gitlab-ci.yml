# GitLab CI/CD Pipeline for {{ repo_name }} Spring Boot Library
# Generated by GitLab Repository Sculptor

stages:
  - test
  - build
  - publish

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  SPRING_PROFILES_ACTIVE: "test"

cache:
  paths:
    - .m2/repository/
    - target/

# Test stage
test:
  stage: test
  image: maven:3.9.4-eclipse-temurin-17
  services:
    - postgres:13
    - redis:6
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/test_db"
    SPRING_DATASOURCE_USERNAME: "test_user"
    SPRING_DATASOURCE_PASSWORD: "test_pass"
    SPRING_REDIS_HOST: "redis"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl
  script:
    - echo "Running Spring Boot tests..."
    - mvn $MAVEN_CLI_OPTS clean verify
    - mvn $MAVEN_CLI_OPTS jacoco:report
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/

# Code quality
code_quality:
  stage: test
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS checkstyle:check
    - mvn $MAVEN_CLI_OPTS spotbugs:check
  allow_failure: true

# Security scan
security:
  stage: test
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS dependency-check:check
  artifacts:
    reports:
      dependency_scanning: target/dependency-check-report.json
  allow_failure: true

# Build package
build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - echo "Building Spring Boot library..."
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
    - mvn $MAVEN_CLI_OPTS source:jar javadoc:jar
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  only:
    - main
    - tags

# Publish to Maven Central (manual action)
publish:central:
  stage: publish
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests
  dependencies:
    - build
  when: manual
  only:
    - tags

# Publish to GitLab Package Registry
publish:gitlab:
  stage: publish
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS deploy -DskipTests -s settings.xml
  dependencies:
    - build
  only:
    - tags