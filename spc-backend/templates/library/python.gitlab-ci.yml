# GitLab CI/CD Pipeline for {{ repo_name }} Python Library
# Generated by GitLab Repository Sculptor

stages:
  - test
  - build
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  paths:
    - .cache/pip/
    - venv/

# Test stage
test:
  stage: test
  image: python:3.11
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install pytest pytest-cov flake8 black isort
  script:
    - echo "Running code quality checks..."
    - flake8 src/ tests/
    - black --check src/ tests/
    - isort --check-only src/ tests/
    - echo "Running tests..."
    - pytest tests/ --cov=src --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Build package
build:
  stage: build
  image: python:3.11
  script:
    - pip install build twine
    - python -m build
    - twine check dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - tags

# Publish to PyPI (manual action)
publish:pypi:
  stage: publish
  image: python:3.11
  script:
    - pip install twine
    - twine upload dist/*
  dependencies:
    - build
  when: manual
  only:
    - tags
