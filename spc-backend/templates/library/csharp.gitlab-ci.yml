# GitLab CI/CD Pipeline for {{ repo_name }} C# Library
# Generated by GitLab Repository Sculptor

stages:
  - test
  - build
  - publish

variables:
  DOTNET_VERSION: "6.0"
  NUGET_PACKAGES_DIRECTORY: "$CI_PROJECT_DIR/.nuget"

cache:
  paths:
    - .nuget/

# Test stage
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  before_script:
    - dotnet restore --packages $NUGET_PACKAGES_DIRECTORY
  script:
    - echo "Running C# library tests..."
    - dotnet build --no-restore
    - dotnet test --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory ./TestResults/
  coverage: '/Total[^|]*\|[^|]*\s*(\d+(?:\.\d+)?%)/'
  artifacts:
    reports:
      junit:
        - ./TestResults/*.trx
      coverage_report:
        coverage_format: cobertura
        path: ./TestResults/*/coverage.cobertura.xml
    paths:
      - ./TestResults/

# Code quality
code_quality:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  before_script:
    - dotnet restore --packages $NUGET_PACKAGES_DIRECTORY
  script:
    - dotnet format --verify-no-changes
  allow_failure: true

# Security scan
security:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  before_script:
    - dotnet restore --packages $NUGET_PACKAGES_DIRECTORY
  script:
    - dotnet list package --vulnerable --include-transitive
  allow_failure: true

# Build package
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  before_script:
    - dotnet restore --packages $NUGET_PACKAGES_DIRECTORY
  script:
    - echo "Building C# library..."
    - dotnet build --no-restore --configuration Release
    - dotnet pack --no-build --configuration Release --output ./packages
  artifacts:
    paths:
      - ./packages/*.nupkg
    expire_in: 1 week
  only:
    - main
    - tags

# Publish to NuGet.org (manual action)
publish:nuget:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet nuget push "./packages/*.nupkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json
  dependencies:
    - build
  when: manual
  only:
    - tags

# Publish to GitLab Package Registry
publish:gitlab:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION
  script:
    - dotnet nuget push "./packages/*.nupkg" --api-key $CI_JOB_TOKEN --source $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/nuget/index.json
  dependencies:
    - build
  only:
    - tags