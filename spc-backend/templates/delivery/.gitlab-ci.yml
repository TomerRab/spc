# GitLab CI/CD Pipeline for {{ repo_name }} Delivery Repository
# Generated by GitLab Repository Sculptor

stages:
  - validate
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  HELM_CHART_PATH: "./helm"
  MICROSERVICE_IMAGE: "registry.gitlab.com/your-group/{{ repo_name }}"  # Update with actual microservice image
  KUBERNETES_NAMESPACE_DEV: "{{ repo_name }}-dev"
  KUBERNETES_NAMESPACE_STAGING: "{{ repo_name }}-staging" 
  KUBERNETES_NAMESPACE_PROD: "{{ repo_name }}-prod"

# Validate Helm charts
validate:
  stage: validate
  image: alpine/helm:3.12.0
  script:
    - echo "Validating Helm charts..."
    - helm lint $HELM_CHART_PATH
    - helm template {{ repo_name }} $HELM_CHART_PATH --dry-run
  only:
    - merge_requests
    - main
    - develop

# Deploy to development
deploy:dev:
  stage: deploy-dev
  image: alpine/helm:3.12.0
  environment:
    name: development
    url: https://{{ repo_name }}-dev.example.com
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_DEV || echo "Using default context"
  script:
    - echo "Deploying {{ repo_name }} to development..."
    - |
      helm upgrade --install {{ repo_name }} $HELM_CHART_PATH \
        --namespace $KUBERNETES_NAMESPACE_DEV \
        --create-namespace \
        --set image.repository=$MICROSERVICE_IMAGE \
        --set image.tag=${MICROSERVICE_IMAGE_TAG:-latest} \
        --set environment=development \
        --values $HELM_CHART_PATH/values-dev.yaml \
        --wait --timeout=10m
    - kubectl get pods -n $KUBERNETES_NAMESPACE_DEV
  variables:
    MICROSERVICE_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  only:
    - develop
  when: manual

# Deploy to staging
deploy:staging:
  stage: deploy-staging  
  image: alpine/helm:3.12.0
  environment:
    name: staging
    url: https://{{ repo_name }}-staging.example.com
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_STAGING || echo "Using default context"
  script:
    - echo "Deploying {{ repo_name }} to staging..."
    - |
      helm upgrade --install {{ repo_name }} $HELM_CHART_PATH \
        --namespace $KUBERNETES_NAMESPACE_STAGING \
        --create-namespace \
        --set image.repository=$MICROSERVICE_IMAGE \
        --set image.tag=${MICROSERVICE_IMAGE_TAG:-latest} \
        --set environment=staging \
        --values $HELM_CHART_PATH/values-staging.yaml \
        --wait --timeout=10m
    - kubectl get pods -n $KUBERNETES_NAMESPACE_STAGING
  variables:
    MICROSERVICE_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  only:
    - main
  when: manual

# Deploy to production
deploy:prod:
  stage: deploy-prod
  image: alpine/helm:3.12.0
  environment:
    name: production
    url: https://{{ repo_name }}.example.com
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_PROD || echo "Using default context"
  script:
    - echo "Deploying {{ repo_name }} to production..."
    - |
      helm upgrade --install {{ repo_name }} $HELM_CHART_PATH \
        --namespace $KUBERNETES_NAMESPACE_PROD \
        --create-namespace \
        --set image.repository=$MICROSERVICE_IMAGE \
        --set image.tag=$MICROSERVICE_IMAGE_TAG \
        --set environment=production \
        --values $HELM_CHART_PATH/values-prod.yaml \
        --wait --timeout=15m
    - kubectl get pods -n $KUBERNETES_NAMESPACE_PROD
  variables:
    MICROSERVICE_IMAGE_TAG: "$CI_COMMIT_TAG"
  only:
    - tags
  when: manual

# Rollback production (manual emergency action)
rollback:prod:
  stage: deploy-prod
  image: alpine/helm:3.12.0
  environment:
    name: production
    url: https://{{ repo_name }}.example.com
  before_script:
    - kubectl config use-context $KUBE_CONTEXT_PROD || echo "Using default context"
  script:
    - echo "Rolling back {{ repo_name }} in production..."
    - helm rollback {{ repo_name }} --namespace $KUBERNETES_NAMESPACE_PROD
    - kubectl get pods -n $KUBERNETES_NAMESPACE_PROD
  when: manual
  only:
    - main
    - tags
