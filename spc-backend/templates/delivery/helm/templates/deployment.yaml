apiVersion: apps/v1
kind: Deployment
metadata:
  name: {%raw%}{{ include "{{ repo_name }}.fullname" . }}{%endraw%}
  labels:
    {%raw%}{{- include "{{ repo_name }}.labels" . | nindent 4 }}{%endraw%}
spec:
  {%raw%}{{- if not .Values.autoscaling.enabled }}{%endraw%}
  replicas: {%raw%}{{ .Values.replicaCount }}{%endraw%}
  {%raw%}{{- end }}{%endraw%}
  selector:
    matchLabels:
      {%raw%}{{- include "{{ repo_name }}.selectorLabels" . | nindent 6 }}{%endraw%}
  template:
    metadata:
      {%raw%}{{- with .Values.podAnnotations }}{%endraw%}
      annotations:
        {%raw%}{{- toYaml . | nindent 8 }}{%endraw%}
      {%raw%}{{- end }}{%endraw%}
      labels:
        {%raw%}{{- include "{{ repo_name }}.selectorLabels" . | nindent 8 }}{%endraw%}
    spec:
      {%raw%}{{- with .Values.imagePullSecrets }}{%endraw%}
      imagePullSecrets:
        {%raw%}{{- toYaml . | nindent 8 }}{%endraw%}
      {%raw%}{{- end }}{%endraw%}
      serviceAccountName: {%raw%}{{ include "{{ repo_name }}.serviceAccountName" . }}{%endraw%}
      securityContext:
        {%raw%}{{- toYaml .Values.podSecurityContext | nindent 8 }}{%endraw%}
      containers:
        - name: {%raw%}{{ .Chart.Name }}{%endraw%}
          securityContext:
            {%raw%}{{- toYaml .Values.securityContext | nindent 12 }}{%endraw%}
          image: "{%raw%}{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}{%endraw%}"
          imagePullPolicy: {%raw%}{{ .Values.image.pullPolicy }}{%endraw%}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {%raw%}{{- if .Values.livenessProbe }}{%endraw%}
          livenessProbe:
            {%raw%}{{- toYaml .Values.livenessProbe | nindent 12 }}{%endraw%}
          {%raw%}{{- end }}{%endraw%}
          {%raw%}{{- if .Values.readinessProbe }}{%endraw%}
          readinessProbe:
            {%raw%}{{- toYaml .Values.readinessProbe | nindent 12 }}{%endraw%}
          {%raw%}{{- end }}{%endraw%}
          resources:
            {%raw%}{{- toYaml .Values.resources | nindent 12 }}{%endraw%}
          {%raw%}{{- if .Values.env }}{%endraw%}
          env:
            {%raw%}{{- toYaml .Values.env | nindent 12 }}{%endraw%}
          {%raw%}{{- end }}{%endraw%}
          {%raw%}{{- if .Values.configMap.enabled }}{%endraw%}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
          {%raw%}{{- end }}{%endraw%}
      {%raw%}{{- if .Values.configMap.enabled }}{%endraw%}
      volumes:
        - name: config-volume
          configMap:
            name: {%raw%}{{ include "{{ repo_name }}.fullname" . }}{%endraw%}-config
      {%raw%}{{- end }}{%endraw%}
      {%raw%}{{- with .Values.nodeSelector }}{%endraw%}
      nodeSelector:
        {%raw%}{{- toYaml . | nindent 8 }}{%endraw%}
      {%raw%}{{- end }}{%endraw%}
      {%raw%}{{- with .Values.affinity }}{%endraw%}
      affinity:
        {%raw%}{{- toYaml . | nindent 8 }}{%endraw%}
      {%raw%}{{- end }}{%endraw%}
      {%raw%}{{- with .Values.tolerations }}{%endraw%}
      tolerations:
        {%raw%}{{- toYaml . | nindent 8 }}{%endraw%}
      {%raw%}{{- end }}{%endraw%}