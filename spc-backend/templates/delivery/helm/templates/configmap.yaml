{%raw%}{{- if .Values.configMap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "{{ repo_name }}.fullname" . }}-config
  labels:
    {{- include "{{ repo_name }}.labels" . | nindent 4 }}
data:
  {{- with .Values.configMap.data }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}{%endraw%}