# Development environment values for {{ repo_name }}
# This file contains development-specific configurations

# Override base values for development
replicaCount: 1

image:
  repository: registry.gitlab.com/your-group/{{ repo_name }}
  pullPolicy: Always
  tag: "develop"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: {{ repo_name }}-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: {{ repo_name }}-dev-tls
      hosts:
        - {{ repo_name }}-dev.example.com

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

nodeSelector: {}

tolerations: []

affinity: {}

# Environment variables for development
env:
  - name: APP_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
  - name: DATABASE_URL
    value: "postgresql://dev-user:dev-pass@postgres:5432/{{ repo_name }}_dev"

# ConfigMap data for development
configMap:
  enabled: true
  data:
    app.properties: |
      debug=true
      log.level=DEBUG
      cors.enabled=true

# Development database
postgresql:
  enabled: true
  auth:
    postgresPassword: "dev-password"
    database: "{{ repo_name }}_dev"
  primary:
    persistence:
      enabled: false  # Use ephemeral storage in dev

# Development cache
redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: false  # Use ephemeral storage in dev