# Development Environment Configuration
# Override values for development deployment

image:
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-dev"
  hosts:
    - host: {{ repo_name }}-dev.{{ cluster_domain | default('example.com') }}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: {{ repo_name }}-dev-tls
      hosts:
        - {{ repo_name }}-dev.{{ cluster_domain | default('example.com') }}

service:
  type: ClusterIP
  port: 80

env:
  NODE_ENV: "development"
  LOG_LEVEL: "debug"

configMap:
  enabled: true
  data:
    database_url: "postgresql://dev-db:5432/{{ repo_name }}_dev"
    redis_url: "redis://dev-redis:6379/0"
    api_base_url: "https://{{ repo_name }}-dev.{{ cluster_domain | default('example.com') }}"

serviceAccount:
  create: true
  annotations: {}

nodeSelector: {}

tolerations: []

affinity: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000