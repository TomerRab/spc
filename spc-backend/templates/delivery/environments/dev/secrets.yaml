# Development Environment Secrets
# These should be encrypted using Helm Secrets, Sealed Secrets, or External Secrets Operator
# This is a template - actual secrets should never be committed in plain text

apiVersion: v1
kind: Secret
metadata:
  name: {{ repo_name }}-dev-secrets
  namespace: {{ repo_name }}-dev
type: Opaque
stringData:
  # Database credentials (these are example values - replace with real encrypted secrets)
  DB_PASSWORD: "dev-password-change-me"
  DB_USERNAME: "dev-user"
  
  # API keys and tokens
  JWT_SECRET: "dev-jwt-secret-change-me"
  API_KEY: "dev-api-key-change-me"
  
  # Third party service credentials
  REDIS_PASSWORD: "dev-redis-password-change-me"
  
  # OAuth/Authentication secrets
  OAUTH_CLIENT_SECRET: "dev-oauth-secret-change-me"
  
  # Monitoring and observability
  DATADOG_API_KEY: "dev-datadog-key-change-me"
  
