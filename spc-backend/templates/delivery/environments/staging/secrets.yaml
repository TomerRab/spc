# Staging Environment Secrets
# These should be encrypted using Helm Secrets, Sealed Secrets, or External Secrets Operator
# This is a template - actual secrets should never be committed in plain text

apiVersion: v1
kind: Secret
metadata:
  name: {{ repo_name }}-staging-secrets
  namespace: {{ repo_name }}-staging
type: Opaque
stringData:
  # Database credentials (these are example values - replace with real encrypted secrets)
  DB_PASSWORD: "staging-password-change-me"
  DB_USERNAME: "staging-user"
  
  # API keys and tokens
  JWT_SECRET: "staging-jwt-secret-change-me"
  API_KEY: "staging-api-key-change-me"
  
  # Third party service credentials
  REDIS_PASSWORD: "staging-redis-password-change-me"
  
  # OAuth/Authentication secrets
  OAUTH_CLIENT_SECRET: "staging-oauth-secret-change-me"
  
  # Monitoring and observability
  DATADOG_API_KEY: "staging-datadog-key-change-me"
  NEWRELIC_LICENSE_KEY: "staging-newrelic-key-change-me"
  
  # Cloud provider credentials
  AWS_ACCESS_KEY_ID: "staging-aws-access-key-change-me"
  AWS_SECRET_ACCESS_KEY: "staging-aws-secret-key-change-me"

