# Production Environment Secrets
# These should be encrypted using Helm Secrets, Sealed Secrets, or External Secrets Operator
# This is a template - actual secrets should never be committed in plain text
# CRITICAL: Never commit production secrets in plain text!

apiVersion: v1
kind: Secret
metadata:
  name: {{ repo_name }}-prod-secrets
  namespace: {{ repo_name }}-prod
type: Opaque
stringData:
  # Database credentials (these are example values - replace with real encrypted secrets)
  DB_PASSWORD: "prod-password-CHANGE-ME-IMMEDIATELY"
  DB_USERNAME: "prod-user"
  
  # API keys and tokens
  JWT_SECRET: "prod-jwt-secret-CHANGE-ME-IMMEDIATELY"
  API_KEY: "prod-api-key-CHANGE-ME-IMMEDIATELY"
  
  # Third party service credentials
  REDIS_PASSWORD: "prod-redis-password-CHANGE-ME-IMMEDIATELY"
  
  # OAuth/Authentication secrets
  OAUTH_CLIENT_SECRET: "prod-oauth-secret-CHANGE-ME-IMMEDIATELY"
  
  # Monitoring and observability
  DATADOG_API_KEY: "prod-datadog-key-CHANGE-ME-IMMEDIATELY"
  NEWRELIC_LICENSE_KEY: "prod-newrelic-key-CHANGE-ME-IMMEDIATELY"
  SENTRY_DSN: "prod-sentry-dsn-CHANGE-ME-IMMEDIATELY"
  
  # Cloud provider credentials
  AWS_ACCESS_KEY_ID: "prod-aws-access-key-CHANGE-ME-IMMEDIATELY"
  AWS_SECRET_ACCESS_KEY: "prod-aws-secret-key-CHANGE-ME-IMMEDIATELY"
  
  # SSL/TLS certificates (if not using cert-manager)
  TLS_CERT: "prod-tls-cert-CHANGE-ME-IMMEDIATELY"
  TLS_KEY: "prod-tls-key-CHANGE-ME-IMMEDIATELY"

