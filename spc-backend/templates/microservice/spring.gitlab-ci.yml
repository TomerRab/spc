# GitLab CI/CD Pipeline for {{ repo_name }} Spring Boot Microservice
# Generated by GitLab Repository Sculptor

stages:
  - test
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  DOCKER_REGISTRY: "registry.gitlab.com"
  DOCKER_IMAGE: "$DOCKER_REGISTRY/$CI_PROJECT_PATH"
  DOCKER_TAG: "$CI_COMMIT_SHORT_SHA"
  KUBERNETES_NAMESPACE_DEV: "{{ repo_name }}-dev"
  KUBERNETES_NAMESPACE_STAGING: "{{ repo_name }}-staging"
  KUBERNETES_NAMESPACE_PROD: "{{ repo_name }}-prod"

cache:
  paths:
    - .m2/repository/
    - target/

# Test stage
test:
  stage: test
  image: maven:3.9.4-eclipse-temurin-17
  services:
    - postgres:13
    - redis:6
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/test_db"
    SPRING_DATASOURCE_USERNAME: "test_user"
    SPRING_DATASOURCE_PASSWORD: "test_pass"
    SPRING_REDIS_HOST: "redis"
    SPRING_PROFILES_ACTIVE: "test"
  script:
    - echo "Running Spring Boot microservice tests..."
    - mvn $MAVEN_CLI_OPTS clean verify
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml

# Security scan
security:
  stage: test
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS dependency-check:check
  allow_failure: true

# Build Docker image
build:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$DOCKER_TAG
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
    - develop
    - tags

# Deploy to development
deploy:dev:
  stage: deploy-dev
  image: bitnami/kubectl:latest
  environment:
    name: development
    url: https://{{ repo_name }}-dev.example.com
  script:
    - echo "Deploying Spring Boot microservice to development..."
    - kubectl config use-context $KUBE_CONTEXT_DEV
    - kubectl set image deployment/{{ repo_name }} {{ repo_name }}=$DOCKER_IMAGE:$DOCKER_TAG -n $KUBERNETES_NAMESPACE_DEV
    - kubectl rollout status deployment/{{ repo_name }} -n $KUBERNETES_NAMESPACE_DEV
  only:
    - develop
  when: manual

# Deploy to staging
deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://{{ repo_name }}-staging.example.com
  script:
    - echo "Deploying to staging environment..."
    - kubectl config use-context $KUBE_CONTEXT_STAGING
    - kubectl set image deployment/{{ repo_name }} {{ repo_name }}=$DOCKER_IMAGE:$DOCKER_TAG -n $KUBERNETES_NAMESPACE_STAGING
    - kubectl rollout status deployment/{{ repo_name }} -n $KUBERNETES_NAMESPACE_STAGING
  only:
    - main
  when: manual

# Deploy to production
deploy:prod:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://{{ repo_name }}.example.com
  script:
    - echo "Deploying to production environment..."
    - kubectl config use-context $KUBE_CONTEXT_PROD
    - kubectl set image deployment/{{ repo_name }} {{ repo_name }}=$DOCKER_IMAGE:$DOCKER_TAG -n $KUBERNETES_NAMESPACE_PROD
    - kubectl rollout status deployment/{{ repo_name }} -n $KUBERNETES_NAMESPACE_PROD
  only:
    - tags
  when: manual