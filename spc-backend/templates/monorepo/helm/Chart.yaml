apiVersion: v2
name: {{ repo_name }}
description: A Helm chart for {{ repo_name }} monorepo application
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - application
  - microservices
  - {{ stack }}

maintainers:
  - name: DevOps Team
    email: devops@example.com

dependencies:
  - name: postgresql
    version: 12.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.x.x
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
