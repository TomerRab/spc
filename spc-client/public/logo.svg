<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <!-- Solid Project Creator Logo -->
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="200" fill="#FC6D26" opacity="0.1"/>
  <circle cx="200" cy="200" r="160" fill="#FC6D26" opacity="0.15"/>
  
  <!-- GitLab Orange Background -->
  <circle cx="200" cy="200" r="120" fill="#FC6D26"/>
  
  <!-- Repository Structure -->
  <g transform="translate(200, 200)">
    <!-- Main Repository Box -->
    <rect x="-50" y="-40" width="100" height="60" rx="8" fill="white" opacity="0.9"/>
    
    <!-- Git Branches -->
    <g stroke="white" stroke-width="3" fill="none" opacity="0.8">
      <!-- Main branch -->
      <path d="M-35,-20 Q-20,-35 0,-35 Q20,-35 35,-20"/>
      <!-- Feature branch -->
      <path d="M-20,-20 Q-10,-5 10,-5 Q25,-5 35,10"/>
      <!-- Merge lines -->
      <path d="M0,-35 L0,-20"/>
      <path d="M10,-5 L10,10"/>
    </g>
    
    <!-- Repository Icons -->
    <g fill="white" opacity="0.9">
      <!-- File icons -->
      <rect x="-40" y="-30" width="12" height="16" rx="2"/>
      <rect x="-25" y="-30" width="12" height="16" rx="2"/>
      <rect x="-10" y="-30" width="12" height="16" rx="2"/>
      
      <!-- Folder icon -->
      <path d="M15,-30 L15,-25 Q15,-23 17,-23 L33,-23 Q35,-23 35,-21 L35,-16 Q35,-14 33,-14 L17,-14 Q15,-14 15,-16 Z"/>
    </g>
    
    <!-- Sculptor Tools -->
    <g transform="translate(0, 40)">
      <!-- Chisel/Tool -->
      <g stroke="#2E3A59" stroke-width="2.5" fill="none">
        <path d="M-25,15 L-15,25 L15,-5 L5,-15 Z"/>
        <circle cx="8" cy="-8" r="3" fill="#2E3A59"/>
      </g>
      
      <!-- Hammer -->
      <g stroke="#2E3A59" stroke-width="2.5" fill="#2E3A59">
        <rect x="15" y="10" width="8" height="4" rx="2"/>
        <path d="M23,12 L35,12" stroke-width="1.5"/>
      </g>
    </g>
    
    <!-- Automation Gear -->
    <g transform="translate(60, -60)">
      <g fill="#FCA326" opacity="0.8">
        <circle cx="0" cy="0" r="12"/>
        <path d="M-8,-8 L-4,-12 L4,-12 L8,-8 L12,-4 L12,4 L8,8 L4,12 L-4,12 L-8,8 L-12,4 L-12,-4 Z"/>
        <circle cx="0" cy="0" r="4" fill="white"/>
      </g>
    </g>
    
    <!-- Code Brackets -->
    <g transform="translate(-70, 60)" fill="#2E3A59" opacity="0.7">
      <path d="M0,0 Q-5,-5 -5,-10 Q-5,-15 0,-20"/>
      <path d="M10,-20 Q15,-15 15,-10 Q15,-5 10,0"/>
    </g>
  </g>
  
  <!-- GitLab Logo Style Accent -->
  <path d="M200 80 L160 160 L240 160 Z" fill="#E24329" opacity="0.3"/>
  <path d="M200 320 L160 240 L240 240 Z" fill="#E24329" opacity="0.3"/>
</svg>